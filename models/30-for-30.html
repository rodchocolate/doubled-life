d-nose or flat-nose bullets to ensure safety in tubular magazines."}], "facts": [{"label": "ESPN Series Founders", "value": "Bill Simmons and Connor Schell"}, {"label": "SZA Song Chart Performance", "value": "Debuted atop the US Hot R&B Songs chart"}, {"label": "Cartridge Introduction Year", "value": "1895"}, {"label": "ESPN Series Accolades", "value": "2016 Academy Award for Best Documentary Feature (O.J.: Made in America)"}, {"label": "label la SZA and Lamar collaboration date", "value": "January 7, 2025"}, {"label": "Cartridge Primary Rifle", "value": "Winchester Model 1894 lever-action rifle"}]}, "ornith": {"lede": "30 for 30 is a series of documentary films airing on ESPN, its sister networks, and online that highlights interesting people and events in sports history. The concept originated in 2007 from Bill Simmons and Connor Schell as 30 films to celebrate ESPN's 30th anniversary in 2009. The franchise has expanded to include multiple volumes of episodes, shorts, a companion series on women's sports, and audio podcasts.", "sections": [{"heading": "", "body": "The idea for the series began in 2007 from ESPN.com columnist Bill Simmons and ESPN's Connor Schell. The title derived from the genesis of 30 films in celebration of ESPN's 30th anniversary in 2009, exploring the biggest stories from ESPN's first 30 years on-air through a series of one-hour films by 30 filmmakers. Volume I premiered in October 2009 and ran to December 2010, chronicling 30 stories from the \"ESPN era\" beginning with the network's founding in 1979."}, {"heading": "", "body": "The series includes four volumes of 30 episodes each, a 13-episode series under the ESPN Films Presents title in 2011\u20132012, and a series of shorts shown through the ESPN.com website. The franchise has expanded to include Soccer Stories, which aired ahead of the 2014 FIFA World Cup, as well as audio podcasts. In April 2018, it was announced that the entire archive would be available on ESPN+ upon its launch."}, {"heading": "", "body": "The series received a slow start with poor ratings for its first film but grew as awareness increased. It has won numerous awards, including a 2016 Academy Award for Best Documentary Feature for O.J.: Made in America, a 2014 Primetime Emmy Award, and multiple Peabody Awards. The series is sponsored by Cadillac and Levi's."}], "facts": [{"label": "Creator", "value": "Bill Simmons and Connor Schell"}, {"label": "Premiere Date", "value": "October 2009"}, {"label": "Network", "value": "ESPN"}, {"label": "Original Concept", "value": "30 films for ESPN's 30th anniversary"}, {"label": "Notable Award", "value": "2016 Academy Award for Best Documentary Feature (O.J.: Made in America)"}, {"label": "Presenting Sponsors", "value": "Cadillac and Levi's"}]}, "gemma-small": {"lede": "30 for 30 is the title of three distinct subjects covered in these sources: a documentary film series about sports, a popular song by SZA and Kendrick Lamar, and an early sporting cartridge designation. The documentary series highlights significant moments and figures in sports history, while the song was released as part of SZA's album *Lana*.", "sections": [{"heading": "", "body": "The 30 for 30 film series is a collection of documentaries airing on ESPN and its sister networks that highlight interesting people and events in sports history. The concept originated in 2007 from Bill Simmons, an ESPN.com columnist, and Connor Schell. Initially titled to celebrate ESPN's 30th anniversary in 2009, Volume I premiered in October 2009, chronicling 30 stories from the network\u2019s first three decades of existence. Subsequent volumes expanded the series beyond the 'ESPN era,' and it has also included formats like Soccer Stories and audio podcasts."}, {"heading": "", "body": "\"30 for 30\" is a song by SZA and Kendrick Lamar, released on January 7, 2025, as a single from SZA's first reissue album, *Lana*. The track was written by both artists, along with Bobby DeBarge, Greg Williams, Anthony Jermaine White, and Michael Uzowuru. It arrived shortly after the release of Lamar\u2019s sixth studio album, GNX, and features SZA delivering a confident rap-singing performance."}, {"heading": "", "body": "The .30-30 Winchester cartridge (also known as 7.62\u00d752mmR or .30 WCF) was first marketed in 1895 for the Winchester Model 1894 lever-action rifle. It was one of the United States' first small-bore sporting rifle cartridges designed for smokeless powder. The cartridge remains widely used due to its reliable effectiveness in civilian hunting applications, and it is noted for leaving lower volumes of spoiled venison after a kill."}], "facts": [{"label": "Documentary Series Scope", "value": "Highlights interesting people and events in sports history."}, {"label": "Song Release Date", "value": "January 7, 2025"}, {"label": "Cartridge Introduction Year", "value": "1895"}, {"label": "Sporting Cartridge Use", "value": "Commonly used on whitetail, mule deer, pronghorn, caribou, elk, moose, and black bear."}]}, "mistral": {"lede": "30 for 30 is a series of documentary films airing on ESPN, highlighting interesting people and events in sports history. It began as a celebration of ESPN's 30th anniversary but has since expanded beyond the 'ESPN era'.", "sections": [{"heading": "", "body": "The series consists of four volumes, each containing 30 episodes, along with additional specials and shorts. It was created by ESPN.com columnist Bill Simmons and Connor Schell in celebration of ESPN's 30th anniversary."}, {"heading": "", "body": "Volume I premiered in October 2009 and ran to December 2010, chronicling 30 stories from the 'ESPN era'. Subsequent films expanded the series beyond this timeframe. In September 2014, Schell stated that there was no shortage of incredible moments from the world of sports, enabling them to continue making quality films."}, {"heading": "", "body": "The series has received positive reviews and critical acclaim, winning awards such as the Peabody Award (2010), International Documentary Association's Distinguished Continuing Series (2010), Primetime Emmy Award for Outstanding Short-Format Nonfiction Program (2014), and Academy Award for Best Documentary Feature (2016) for O.J.: Made in America."}], "facts": [{"label": "Creator", "value": "Bill Simmons and Connor Schell"}, {"label": "Premiere Date", "value": "October 6, 2009"}, {"label": "Number of Episodes (Volumes I-IV)", "value": "120"}, {"label": "Awards Won", "value": "Peabody Award, International Documentary Association's Distinguished Continuing Series, Primetime Emmy Award, Academy Award for Best Documentary Feature"}]}, "qwen-coder": {"lede": "['30 for 30 is a series of documentary films airing on ESPN and its platforms, highlighting interesting people and events in sports history.', \"The series includes four volumes of 30 episodes each, an additional 13-episode series, and online shorts, expanding beyond the 'ESPN era' to cover broader sports history.\"]", "sections": [{"heading": "", "body": "The idea for 30 for 30 originated in 2007 from ESPN.com columnist Bill Simmons and ESPN's Connor Schell. The series was initially conceived as a celebration of ESPN's 30th anniversary with 30 one-hour films by 30 filmmakers, exploring significant sports stories from the network's first three decades."}, {"heading": "", "body": "Volume I premiered in October 2009 and covered events from ESPN's founding in 1979. Subsequent volumes and online shorts expanded the series to include a wide range of sports stories beyond ESPN's history, including Soccer Stories ahead of the 2014 FIFA World Cup."}, {"heading": "", "body": "The series received mixed critical responses, with some episodes receiving high praise while others were less favorably reviewed. Despite a slow start in terms of ratings, awareness and critical acclaim led to increased viewership over time. The series has won several awards, including the 2016 Academy Award for Best Documentary Feature for 'O.J.: Made in America'."}], "facts": [{"label": "Series Origin", "value": "Conceived in 2007 by Bill Simmons and Connor Schell to celebrate ESPN's 30th anniversary."}, {"label": "Initial Volume Release", "value": "Volume I premiered in October 2009, covering events from ESPN's founding in 1979."}, {"label": "Number of Episodes", "value": "Includes four volumes of 30 episodes each, a 13-episode series, and online shorts."}, {"label": "Notable Awards", "value": "Won the 2016 Academy Award for Best Documentary Feature for 'O.J.: Made in America'."}, {"label": "Sponsors", "value": "Cadillac and Levi's are presenting sponsors of the series."}, {"label": "Platform Availability", "value": "Available on ESPN, its sister networks, and online platforms including ESPN+."}, {"label": "Series Expansion", "value": "Expanded to include Soccer Stories ahead of the 2014 FIFA World Cup and audio podcasts."}, {"label": "Executive Producers", "value": "John Dahl, Connor Schell, and Bill Simmons served as executive producers in 2010."}]}}, ORDER=["gemma", "ornith", "gemma-small", "mistral", "qwen-coder"], COLORS={"gemma": "#7cc4ff", "ornith": "#ff8a8a", "gemma-small": "#9ad0a0", "mistral": "#d0a0ff", "qwen-coder": "#ffd27c"};
