const M={"gemma": {"lede": "Jimmy Buffett own an American singer-songwriter, author, and businessperson who was known for his tropical music sound blending country, rock, folk, and calypso. He promoted a lifestyle of \"island escapism\" and recorded many hit songs, including \"Margaritaville\".", "sections": [{"title": "Early Life and Education", "body": "Jimmy Buffett was born on December 25, 1946, in Pascagoula, Mississippi. He was the son of Mary Lorraine and James Delaney Buffett Jr., a marine engineer and sailor who worked for the United States Army Corps of Engineers. Influenced by his father and grandfather\u2014a steamship captain from Newfoundland\u2014Buffett was exposed to sailing as a child. He was educated by Jesuits as a Catholic and served as an altar boy. In 1961, after seeing a folk music ensemble perform in Biloxi, Mississippi, Buffett realized he wanted to be a musician. After attending St. Ignatius Catholic School in Mobile, where he played trombone in the school band, he graduated from McGill Institute in 1964. He later enrolled at Auburn University, but flunked out after a year in April 1966 due to his interest in music and girls. He eventually earned a bachelor's degree in history in 1969 from the University of Southern Mississippi after attending Pearl River Community College. During college, he worked as an electrician and welder in a shipyard."}, {"title": "Music Career", "body": "After graduating in 1969, Buffett moved to New Orleans, where he performed for tourists on Decatur Street and at the Bayou Room nightclub. In 1970, he moved to Nashville to pursue a country music career, where he worked as an editorial assistant for Billboard. He signed a two-album contract with Barnaby Records, releasing his first album, Down to Earth, in August 1970. After an impromptu audition, he was hired as the opening act for Dianne Davidson at the Exit/In club in Nashville. In November 1971, he moved to Key West, Florida, where he became involved in the literary scene and worked as a first mate on a yacht. As part of terms of a recording contract with ABC/Dunhill Records in 1973, he was promoted as a replacement for Jim Croce. After releasing A White Sport Coat and a Pink Crustacean in June 1973, he formed the Coral Reefer Band in 1975. He recorded several hit songs known as \"The Big 8\", which include \"Margaritaville\" (1977), \"Come Monday\" (1974), \"Fins\" (1979), \"Volcano\" (1979), \"A Pirate Looks at Forty\" (1974), \"Cheeseburger in Paradise\" (1978), \"Why Don't We Get Drunk\" (1973), and \"Changes in Latitudes, Changes in Attitudes\" (1977). He released over 30 albums, with eight certified gold and nine certified platinum or multi-platinum by the RIAA. He was posthumously inducted into the Rock and Roll Hall of Fame in 2024 in the Musical Excellence category."}, {"title": "Business Ventures", "body": "Buffett parlayed his \"island escapism\" lifestyle into several business ventures, including hotels, casinos, liquor, retirement communities, and a bestselling author career. He founded the Jimmy Buffett's Margaritaville restaurant chain, and the now-defunct Cheeseburger in Paradise restaurant chain. The brand is owned by Margaritaville Holdings LLC. The Margaritaville hospitality company manages and franchises casual dining American restaurants, retail stores selling merchandise, and themed hotels. This includes various locations across the United States, Canada, Mexico, and the Caribbean, as well as Sydney, Australia. Specific ventures include Landshark Bar & Grill, Air Margaritaville airport lounge restaurants, and vacation clubs in Puerto Rico and Rio Grande, St. Thomas, Virgin Islands. He also partnered with Outback Steakhouse to develop the first Cheeseburger in Paradise restaurant in 2002."}], "facts": [{"label": "Born", "value": "December 25, 1946"}, {"label": "Died", "value": "September 1, 2023"}, {"label": "\u3082s", "value": "Pascagoula, Mississippi"}, {"label": "Net Worth", "value": "Estimated be ng, \"Margaritaville\" (1977), is ranked 234th on the RIAA's list of \"Songs of the Century.\" Other hits known as \"The Big 8\" include \"Cheeseburger in Paradise,\" \"Come Monday,\" and \"A Pirate Looks at Forty.\""}, {"heading": "", "body": "Buffett parlayed his musical persona into several business ventures, including the Jimmy Buffett's Margaritaville restaurant chain and the Cheeseburger in Paradise restaurant chain. The earliest venture named Margaritaville was a nightclub in Gulf Shores, Alabama, opened in 1984. In January 1985, Buffett opened his first Margaritaville retail store in Key West, Florida. By May 1986, the store had become an eatery. The brand expanded internationally with locations in Canada, Mexico, the Caribbean, and Sydney, Australia. In 2007, plans were announced for a $700 million Margaritaville Casino Resort in Biloxi, Mississippi, but construction ceased due to the U.S. recession."}, {"heading": "", "body": "Buffett released over 30 albums, eight of which are certified gold and nine certified platinum or multi-platinum by the RIAA. He received two Grammy Award nominations and was posthumously inducted into the Rock and Roll Hall of Fame in the Musical Excellence category in 2024. His devoted fans are known as \"Parrotheads.\" Buffett's estate was estimated to be worth $275 million at the time of his death."}], "facts": [{"label": "Born", "value": "December 25, 1946, Pascagoula, Mississippi"}, {"label": "Died", "value": "September 1, 2023"}, {"label": "Genres", "value": "Tropical music, country, rock, folk, calypso"}, {"label": "Known For", "value": "\"Island escapism\" lifestyle and persona"}, {"label": "Records Sold", "value": "Over 20 million certified records worldwide"}, {"label": "Hall of Fame", "value": "Rock and Roll Hall of Fame (inducted 2024)"}, {"label": "Business Ventures", "value": "Jimmy Buffett's Margaritaville restaurant chain, Cheeseburger in Paradise"}, {"label": "Fans Known As", "value": "Parrotheads"}]}, "gemma-small"  stores, and themed hotels across locations including the United States, Canada, Mexico, and several Caribbean islands."}, {"heading": "", "body": "Buffett sold over 20 million certified records worldwide and had an estate estimated to be worth $275 million. He was a bestselling author and received two Grammy Award nominations. In addition to his musical achievements, he became one of the primary sponsors for the Minto U.S. Open Pickleball Championships in Naples, Florida."}], "facts": [{"label": "Born", "value": "December 25, 1946, in Pascagoula, Mississippi"}, {"label": "Known For", "value": "Tropical music sound blending country, rock, folk, calypso, and 'island escapism' persona"}, {"label": "Key Hits", "value": "\"Margaritaville,\" \"Come Monday,\" \"Cheeseburger in Paradise\""}, {"label": "Band Formation", "value": "Formed the Coral Reefer Band in 1975"}, {"label": "Industry Recognition", "value": "Posthumously inducted into the Rock and Roll Hall of Fame in 2024"}, {"label": "Business Empire", "value": "Jimmy Buffett's Margaritaville restaurant chain, retail stores, and hotels"}]}, "mistral": {"lede": "Jimmy Buffett (1946-2023) was an American singer-songwriter, author, and businessperson known for his tropical music sound blending country, rock, folk, calypso, and his persona promoting 'island escapism'. He recorded many hit songs, sold over 20 million certified records worldwide, and had a net worth of $550 million.", "sections": [{"heading": "", "body": "Buffett was born in Pascagoula, Mississippi, lived in Mobile and Fairhope, Alabama, and was educated by Jesuits. He realized he wanted to be a musician after seeing a folk music ensemble perform at eight. Buffett graduated from McGill Institute in 1964 and earned a bachelor's degree in history from the University of Southern Mississippi in 1969."}, {"heading": "", "body": "Buffett moved to New Orleans after graduating, then Nashville where he worked for Billboard. He signed with Barnaby Records but his sec
