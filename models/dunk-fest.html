lled Sound The Mute. Initially aiming for a huge and heavy sounding project, the group incorporated themes such as loss, grief, hope, space exploration, war, and stories from history into their albums. Their first record, *Crimea*, was released in 2009, inspired by poems about the Crimean War."}, {"heading": "", "body": "The band gained widespread acclaim with their third studio album, *Departure Songs*. This highly regarded post-rock release is noted for being the band's first all-instrumental work and a concept album inspired by failed, yet epic and honourable individual journeys. Following its release, the group embarked on extensive national tours of Australia and supported various international bands. They also undertook their first ever overseas tour to Europe in May 2017, which included a debut show at the Belgian post-rock festival Dunk! The band continues to release new material, including *Triumph and Disaster* (2019) and *A Single Flower* (2025)."}, {"heading": "", "body": "The current lineup of We Lost the Sea consists of Mark Owen, Matt Harvey, Mathew Kelly, Kieran Elliott, Alasdair Belling, and Carl Whitbread. The band's member line-up has changed many times throughout its history. Following the death of vocalist Chris Torpy in 2013, the band continued performing without him. In January 2017, guitarist Brendon Warner left the band to focus on his studies."}], "facts": [{"label": "Origin", "value": "Sydney, Australia (outer west Sydney suburb of Campbelltown)"}, {"label": "Genre", "value": "Instrumental post-rock"}, {"label": "Current Label", "value": "Bird's Robe Records (distributed through MGM in Australia)"}, {"label": "Debut Album", "value": "*Crimea* (2009)"}, {"label": "Key Album", "value": "*Departure Songs* (2015)"}, {"label": "Notable Event", "value": "Made a debut show at the Belgian post-rock festival Dunk! in May 2017"}]}, "mistral": {"lede": "Dunk Fest is a Belgian music festival known for hosting notable performances, including one by Russian Circles that was recorded and released as a live album.", "sections": [{"heading": "", "body": "Live at Dunk! Fest is the second live album by American post-metal band Russian Circles. It was recorded on May 7, 2016 at a performance in Zottegem, Belgium during the festival."}], "facts": [{"label": "Release Date", "value": "May 7, 2016"}, {"label": "Band", "value": "Russian Circles"}, {"label": "Genre", "value": "Post-metal"}, {"label": "Label", "value": "Sargent House"}]}, "qwen-coder": {"lede": "['Live at Dunk! Fest is a live album by American post-metal band Russian Circles, released digitally and on vinyl through Sargent House.', \"Recorded on May 7, 2016, during an unanticipated professional recording of their performance in Zottegem, Belgium, the album marks Russian Circles' first live release.\"]", "sections": [{"heading": "", "body": "On May 7, 2016, Russian Circles headlined at a festival in Zottegem, Belgium. Unbeknownst to the band, the show was being professionally recorded. Bassist Brian Cook expressed that going into a show with the plan of documenting it on record was not something they were excited about, as good shows are more about creating a good vibe rather than playing everything perfectly."}, {"heading": "", "body": "The album features Russian Circles with Mike Sullivan on guitar, Brian Cook on bass, and Dave Turncrantz on drums. Technical personnel involved in the recording include Chris Le Dantec as front of house engineer, Jannes Van Rossom for audio recording, Dallas Thomas as mixer, Collin Jordan for mastering, Error! Design for artwork, and Davy De Pauw and Gosia Wanda for concert photography."}], "facts": [{"label": "Release Date", "value": "2016"}, {"label": "Format", "value": "Digital and Vinyl"}, {"label": "Label", "value": "Sargent House"}, {"label": "Recording Location", "value": "Zottegem, Belgium"}, {"label": "Band Members", "value": "Mike Sullivan (guitar), Brian Cook (bass), Dave Turncrantz (drums)"}, {"label": "Technical Personnel", "value": "Chris Le Dantec, Jannes Van Rossom, Dallas Thomas, Collin Jordan"}, {"label": "Artwork Designers", "value": "Error! Design"}, {"label": "Photographers", "value": "Davy De Pauw, Gosia Wanda"}]}, "ornith": {"lede": "Dunk Fest is a music festival held in Zottegem, Belgium. The event has hosted performances by international post-metal and post-rock acts, including Russian Circles, who headlined the 2016 edition.", "sections": [{"heading": "", "body": "Dunk Fest is a music festival located in Zottegem, Belgium. It has been described as a Belgian post-rock festival."}, {"heading": "", "body": "On May 7, 2016, the American post-metal band Russian Circles headlined at Dunk Fest in Zottegem. The performance was professionally recorded and later released as 'Live at Dunk! Fest,' which marked the band's first live album. Bassist Brian Cook noted that while they were not initially excited about documenting the show on record due to pressure, the result captured a good vibe rather than perfect playing."}, {"heading": "", "body": "In May 2017, the Australian instrumental post-rock band We Lost the Sea performed at Dunk Fest. This appearance marked their debut show on their first overseas tour to Europe, which included 16 shows across the continent."}], "facts": [{"label": "Location", "value": "Zottegem, Belgium"}, {"label": "Genre Focus", "value": "Post-rock and post-metal"}, {"label": "Notable Headliner (2016)", "value": "Russian Circles"}, {"label": "Notable Performer (2017)", "value": "We Lost the Sea"}]}}, ORDER=["gemma", "ornith", "gemma-small", "mistral", "qwen-coder"], COLORS={"gemma": "#7cc4ff", "ornith": "#ff8a8a", "gemma-small": "#9ad0a0", "mistral": "#d0a0ff", "qwen-coder": "#ffd27c"};
