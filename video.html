<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOUBLED.LIFE — Video</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Full Chat Layout - No Split */
    .chat-layout {
      height: calc(100vh - 60px);
      display: flex;
      flex-direction: column;
      max-width: 800px;
      margin: 0 auto;
      background: rgba(0, 0, 0, 0.3);
    }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .chat-message {
      max-width: 100%;
      animation: fadeIn 0.2s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .chat-message--user {
      align-self: flex-end;
      background: var(--accent);
      color: #000;
      padding: 12px 18px;
      border-radius: var(--radius);
      max-width: 80%;
    }
    
    .chat-message--system {
      align-self: flex-start;
      background: var(--glass);
      border: 1px solid var(--card-border);
      padding: 12px 18px;
      border-radius: var(--radius);
      max-width: 80%;
    }
    
    .chat-message--video {
      align-self: stretch;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      backdrop-filter: blur(10px);
    }
    
    /* Video Results Group */
    .video-results-group__header {
      padding: 10px 14px;
      font-size: 0.85rem;
      color: var(--muted);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    /* ==========================================
       CURATED CARDS - Individual cards like toxico
       Can interweave offers between them
       ========================================== */
    
    /* Featured card - 60% width, height scales proportionally */
    .video-card-featured {
      width: 60%;
      background: rgba(30, 33, 34, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      backdrop-filter: blur(5px);
    }
    
    .video-card-featured:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    
    .video-card-featured__thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: #111;
      position: relative;
      overflow: hidden;
    }
    
    .video-card-featured__thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .video-card-featured__play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.3);
      opacity: 0;
      transition: opacity 0.2s;
    }
    
    .video-card-featured__play i {
      font-size: 3rem;
      color: white;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    
    .video-card-featured:hover .video-card-featured__play {
      opacity: 1;
    }
    
    .video-card-featured__info {
      padding: 12px 14px;
    }
    
    .video-card-featured__title {
      font-size: 1rem;
      font-weight: 600;
      margin: 0 0 4px;
      color: var(--fg);
    }
    
    .video-card-featured__meta {
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0;
    }
    
    /* Row container for 3 cards */
    .video-cards-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    
    /* Individual small card */
    .video-card {
      background: rgba(30, 33, 34, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      backdrop-filter: blur(5px);
    }
    
    .video-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    
    .video-card__thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: #111;
      overflow: hidden;
    }
    
    .video-card__thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .video-card__info {
      padding: 8px 10px;
    }
    
    .video-card__title {
      font-size: 0.8rem;
      font-weight: 500;
      margin: 0;
      color: var(--fg);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
    }
    
    .video-card__channel {
      font-size: 0.7rem;
      color: var(--muted);
      margin: 4px 0 0;
    }
    
    /* Mobile: row becomes vertical list */
    @media (max-width: 500px) {
      .video-cards-row {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      
      .video-card {
        display: flex;
        flex-direction: row;
        align-items: center;
      }
      
      .video-card__thumb {
        width: 120px;
        flex-shrink: 0;
        aspect-ratio: 16/9;
      }
      
      .video-card__info {
        flex: 1;
        padding: 10px 12px;
      }
    }
    
    /* Shuffle button */
    .btn-shuffle {
      background: rgba(30, 33, 34, 0.6);
      border: 1px solid var(--card-border);
      color: var(--muted);
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    
    .btn-shuffle:hover {
      background: rgba(30, 33, 34, 0.8);
      color: var(--fg);
      border-color: var(--accent);
    }
    
    .btn-shuffle i {
      font-size: 0.9rem;
    }
    
    /* Search Results List (no API key mode) */
    .search-results-list {
      display: flex;
      flex-direction: column;
    }
    
    .search-result-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      cursor: pointer;
      transition: background 0.2s;
      border-bottom: 1px solid var(--card-border);
    }
    
    .search-result-item:last-child {
      border-bottom: none;
    }
    
    .search-result-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    
    .search-result-icon {
      width: 40px;
      height: 40px;
      background: rgba(255, 0, 0, 0.15);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ff4444;
      font-size: 1rem;
      flex-shrink: 0;
    }
    
    .search-result-text {
      flex: 1;
      min-width: 0;
    }
    
    .search-result-query {
      margin: 0 0 2px;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--fg);
    }
    
    .search-result-hint {
      margin: 0;
      font-size: 0.8rem;
      color: var(--muted);
    }
    
    .search-result-arrow {
      color: var(--muted);
      font-size: 0.85rem;
    }
    
    /* Featured Video (Full Width) */
    .video-featured {
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .video-featured:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    
    .video-featured__thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #111;
      overflow: hidden;
    }
    
    .video-featured__thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .video-featured__play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.3);
      opacity: 0;
      transition: opacity 0.2s;
    }
    
    .video-featured__play i {
      font-size: 3rem;
      color: white;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    
    .video-featured:hover .video-featured__play {
      opacity: 1;
    }
    
    .video-featured__info {
      padding: 12px 14px;
    }
    
    .video-featured__title {
      font-size: 1rem;
      font-weight: 600;
      margin: 0 0 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .video-featured__meta {
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0;
    }
    
    /* Row of 3 Videos */
    .video-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      border-top: 1px solid var(--card-border);
    }
    
    .video-row__item {
      cursor: pointer;
      padding: 10px;
      transition: background 0.2s;
    }
    
    .video-row__item:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    
    .video-row__thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: #111;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    
    .video-row__thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .video-row__title {
      font-size: 0.8rem;
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
    }
    
    /* Now Playing (appears when video selected) */
    .now-playing-bar {
      background: rgba(0, 0, 0, 0.9);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      margin: 0 16px 16px;
      overflow: hidden;
      display: none;
    }
    
    .now-playing-bar.active {
      display: block;
    }
    
    .now-playing-bar iframe {
      width: 100%;
      aspect-ratio: 16/9;
      border: none;
      display: block;
    }
    
    .now-playing-bar__info {
      padding: 12px 14px;
      border-top: 1px solid var(--card-border);
    }
    
    .now-playing-bar__title {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 0 0 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .now-playing-bar__channel {
      font-size: 0.8rem;
      color: var(--muted);
      margin: 0;
    }
    
    /* Chat Input - 20% height like other sites */
    .chat-input-area {
      height: 20vh;
      min-height: 120px;
      max-height: 200px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.6);
      border-top: 1px solid var(--card-border);
      display: flex;
      align-items: flex-start;
    }
    
    .chat-input-wrapper {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      width: 100%;
      height: 100%;
    }
    
    .chat-input {
      flex: 1;
      height: 100%;
      background: var(--glass);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 20px;
      color: var(--fg);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      resize: none;
      font-family: inherit;
      line-height: 1.5;
    }
    
    .chat-input:focus {
      border-color: var(--accent);
    }
    
    .chat-input::placeholder {
      color: var(--muted);
    }
    
    .chat-send {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: #000;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: transform 0.1s, background 0.2s;
      flex-shrink: 0;
    }
    
    .chat-send:hover {
      background: var(--accent-hover);
    }
    
    .chat-send:active {
      transform: scale(0.95);
    }
    
    /* Loading indicator */
    .loading {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
    }
    
    .loading-dots {
      display: flex;
      gap: 4px;
    }
    
    .loading-dots span {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.4s ease-in-out infinite;
    }
    
    .loading-dots span:nth-child(1) { animation-delay: 0s; }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    
    /* Mobile adjustments */
    @media (max-width: 600px) {
      .chat-layout {
        max-width: 100%;
      }
      
      .video-row {
        grid-template-columns: repeat(3, 1fr);
        gap: 1px;
      }
      
      .video-row__item {
        padding: 6px;
      }
      
      .video-row__title {
        font-size: 0.7rem;
      }
    }
    
    /* Settings Modal */
    .settings-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .settings-modal.active {
      display: flex;
    }
    
    .settings-content {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      max-width: 480px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    
    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
    }
    
    .settings-header h2 {
      margin: 0;
      font-size: 1.2rem;
    }
    
    .settings-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
    }
    
    .settings-close:hover {
      color: var(--fg);
    }
    
    .settings-body {
      padding: 20px;
    }
    
    .settings-body .form-group {
      margin-bottom: 16px;
    }
    
    .settings-body label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: var(--fg);
    }
    
    .settings-body input,
    .settings-body select {
      width: 100%;
      padding: 12px 14px;
      background: var(--glass);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      color: var(--fg);
      font-size: 0.95rem;
    }
    
    .settings-body input:focus,
    .settings-body select:focus {
      outline: none;
      border-color: var(--accent);
    }
  </style>
</head>

    function hasLLMKey() {
      const provider = LLM_CONFIG.provider;
      if (provider === 'gemini') return !!LLM_CONFIG.gemini_key;
      if (provider === 'groq') return !!LLM_CONFIG.groq_key;

    async function askLLM(userMessage) {
      const provider = LLM_CONFIG.provider;
      
      // System prompt for video search assistant - returns YouTube search URLs
      const systemPrompt = `You are a helpful video assistant. The user will describe what they want to watch.

Your job is to:
1. Understand what they're looking for
2. Respond conversationally in 1-2 sentences  
3. Generate 1-2 YouTube SEARCH QUERIES (not video IDs)

ALWAYS respond in this exact JSON format:
{
  "response": "Your friendly 1-2 sentence response",
  "searches": ["youtube search query 1", "youtube search query 2"]
}

Examples:
User: "I'm feeling stressed"
{"response": "Let me find something relaxing for you.", "searches": ["relaxing lo-fi music 2024", "calming nature ambience"]}

User: "how to cook pasta"
{"response": "Here are some great pasta tutorials!", "searches": ["easy pasta recipe for beginners", "how to cook perfect pasta"]}

User: "something funny"
{"response": "Time for some laughs!", "searches": ["funny videos compilation 2024"]}

Keep searches specific and likely to find good results.`;

      conversationHistory.push({ role: 'user', content: userMessage });
      
      try {
        let result;
        
        if (provider === 'gemini' && LLM_CONFIG.gemini_key) {
          result = await callGemini(systemPrompt, conversationHistory);
        } else if (provider === 'groq' && LLM_CONFIG.groq_key) {
          result = await callGroq(systemPrompt, conversationHistory);
        } else if (provider === 'openai' && LLM_CONFIG.openai_key) {
          result = await callOpenAI(systemPrompt, conversationHistory);
        } else if (provider === 'anthropic' && LLM_CONFIG.anthropic_key) {
          result = await callAnthropic(systemPrompt, conversationHistory);
        } else {
          // No LLM - just use the user message as search query
          return { response: null, searches: [userMessage] };
        }
        
        conversationHistory.push({ role: 'assistant', content: JSON.stringify(result) });
        return result;
        
      } catch (error) {
        console.error('LLM error:', error);
        // Fallback to direct search
        return { response: null, searches: [userMessage] };
      }
    }
    
    async function callGemini(systemPrompt, messages) {
      const lastMessage = messages[messages.length - 1].content;
      
      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${LLM_CONFIG.gemini_key}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: `${systemPrompt}\n\nUser: ${lastMessage}` }]
            }],
            generationConfig: {
              temperature: 0.7,
              maxOutputTokens: 300
            }
          })
        }
      );
      
      const data = await response.json();
      const content = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
      
      // Parse JSON from response
      try {
        // Find JSON in response (may have markdown)
        const jsonMatch = content.match(/\{[\s\S]*\}/);
        if (jsonMatch) {
          return JSON.parse(jsonMatch[0]);
        }
        return { response: content, searches: [messages[messages.length - 1].content] };
      } catch {
        return { response: content, searches: [messages[messages.length - 1].content] };
      }
    }
    
    async function callGroq(systemPrompt, messages) {
      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${LLM_CONFIG.groq_key}`
        },
        body: JSON.stringify({
          model: 'llama-3.1-8b-instant',
          messages: [
            { role: 'system', content: systemPrompt },
            ...messages
          ],
          temperature: 0.7,
          max_tokens: 300
        })
      });
      
      const data = await response.json();
      const content = data.choices[0].message.content;
      
      // Parse JSON from response
      try {
        return JSON.parse(content);
      } catch {
        // If not valid JSON, extract what we can
        return { response: content, searches: [messages[messages.length - 1].content] };
      }
    }
    
    async function callOpenAI(systemPrompt, messages) {
      const response = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${LLM_CONFIG.openai_key}`
        },
        body: JSON.stringify({
          model: 'gpt-4o-mini',
          messages: [
            { role: 'system', content: systemPrompt },
            ...messages
          ],
          temperature: 0.7,
          max_tokens: 300
        })
      });
      
      const data = await response.json();
      const content = data.choices[0].message.content;
      
      try {
        return JSON.parse(content);
      } catch {
        return { response: content, searches: [messages[messages.length - 1].content] };
      }
    }
    
    async function callAnthropic(systemPrompt, messages) {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': LLM_CONFIG.anthropic_key,
          'anthropic-version': '2023-06-01'
        },
        body: JSON.stringify({

        })

      const data = await response.json();

      try {

      } catch {
        return { response: content, searches: [messages[messages.length - 1].content] };
      }
    }

    async function handleUserMessage(message) {
      if (!message.trim()) return;
      
      // Add user message
      addMessage(message, 'user');
      chatInput.value = '';
      
      // Show loading
      const loadingMsg = addLoading();
      
      try {
        // First, check if query matches curated categories
        const matchedCurated = findMatchingCurated(message);
        
        if (matchedCurated.length >= 4) {
          // We have curated content for this! Use it.
          loadingMsg.remove();
          
          // Cards first (1 + 3)
          addCuratedVideos(matchedCurated.slice(0, 4));
          
          // LLM response below
          addMessage(`Found some great ${message} content from your library.`, 'system');
          return;
        }
        
        // Ask LLM to understand and generate search queries
        const llmResult = await askLLM(message);
        
        loadingMsg.remove();
        
        // If we have some curated matches, show those first (cards on top)
        if (matchedCurated.length > 0) {
          const paddedCurated = [...matchedCurated, ...getRandomCurated(4 - matchedCurated.length)].slice(0, 4);
          addCuratedVideos(paddedCurated);
        }
        
        // LLM response below the cards
        if (llmResult.response) {
          addMessage(llmResult.response, 'system');
        }
        
        // If no curated matches, show search links as fallback
        if (matchedCurated.length === 0) {
          const searches = llmResult.searches || [message];
          addSearchResults(searches.slice(0, 3));
        }
        
      } catch (error) {
        loadingMsg.remove();
        console.error('Error:', error);
        
        // Fallback: direct search
        addSearchResults([message]);
      }
    }
    
    // ==========================================
    // Video Player
    // ==========================================
    
    function playVideo(videoId, title, channel) {
      currentVideoId = videoId;
      
      // Update player
      videoPlayer.innerHTML = `
        <iframe 
          src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0" 
          allowfullscreen
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        ></iframe>
      `;
      
      // Show now playing bar and update info
      nowPlayingBar.classList.add('active');
      nowPlayingTitle.textContent = title;
      nowPlayingChannel.textContent = channel;
      
      // Save to history
      saveToHistory(videoId, title, channel);
    }
    
    // ==========================================
    // History
    // ==========================================
    
    function saveToHistory(videoId, title, channel) {
      let history = JSON.parse(localStorage.getItem('videoHistory') || '[]');
      history = history.filter(h => h.id !== videoId);
      history.unshift({ id: videoId, title, channel, timestamp: new Date().toISOString() });
      history = history.slice(0, 50);
      localStorage.setItem('videoHistory', JSON.stringify(history));
    }
    
    // ==========================================
    // Settings Modal
    // ==========================================
    
    function showSettings() {
      const modal = document.getElementById('settingsModal');
      modal.classList.add('active');
      
      // Populate current values
      document.getElementById('llmProvider').value = LLM_CONFIG.provider;
      document.getElementById('openaiKey').value = LLM_CONFIG.openai_key;
      document.getElementById('anthropicKey').value = LLM_CONFIG.anthropic_key;
    }
    
    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('active');
    }
    
    function saveSettings() {
      LLM_CONFIG.provider = document.getElementById('llmProvider').value;
      LLM_CONFIG.openai_key = document.getElementById('openaiKey').value.trim();
      LLM_CONFIG.anthropic_key = document.getElementById('anthropicKey').value.trim();
      
      // Save to localStorage
      localStorage.setItem('llm_provider', LLM_CONFIG.provider);
      localStorage.setItem('openai_api_key', LLM_CONFIG.openai_key);
      localStorage.setItem('anthropic_api_key', LLM_CONFIG.anthropic_key);
      
      closeSettings();
      addMessage('✓ Settings saved!', 'system');
    }
    
    // ==========================================
    // Utils
    // ==========================================
    
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    // ==========================================
    // Event Listeners
    // ==========================================
    
    chatSend.addEventListener('click', () => handleUserMessage(chatInput.value));
    
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleUserMessage(chatInput.value);
      }
    });
    
    // Settings gear in header
    document.querySelector('.nav-links').innerHTML += `
      <a href="#" onclick="showSettings(); return false;" title="Settings">
        <i class="fas fa-cog"></i>
      </a>
    `;
    
    // Initialize with standby suggestions
    showStandbyContent();
  </script>
</body>
</html>
