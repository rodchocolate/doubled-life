const stations = L.filter(l=>l.points?.length>=2).map(l=>{ const top=l.points.reduce((a,b)=>a[2]>b[2]?a:b), bot=l.points.reduce((a,b)=>a[2]<b[2]?a:b); const seq = l.points[0][2] <= l.points[l.points.length-1][2] ? l.points : [...l.points].reverse(); let len=0; for (let i=1;i<seq.length;i++) len += Math.hypot(seq[i][0]-seq[i-1][0], seq[i][1]-seq[i-1][1]); return {l, top, bot, seq, len}; });
const prompt = document.createElement('div'); prompt.id='lift'; prompt.style.cssText='position:fixed;left:50%;bottom:22%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fffcf9;padding:.55rem 1rem;border-radius:10px;font:14px system-ui;display:none;cursor:pointer;border:1px solid rgba(255,252,249,.35);z-index:9'; document.body.appendChild(prompt);
function nearStation(){ let best=null, bd=25*25; for (const s of stations){ const d=(s.bot[0]-px)**2+(s.bot[1]-py)**2; if (d<bd){ bd=d; best=s; } } return best; }
function boardLift(s){ RIDE = { s, t0: performance.now(), dur: Math.max(6000, s.len/1000*20000) }; prompt.style.display='none'; }
prompt.onclick = () => { const s = nearStation(); if (s) boardLift(s); };
addEventListener('keydown', e => { if (e.code==='KeyE'){ const s = nearStation(); if (s && !RIDE) boardLift(s); } }); const keys={};
jump.onchange = () => { const sp = window.__spots.find(x=>x[0]===jump.value); if (!sp) return; const [, at, toward] = sp; px = at[0]; py = at[1]; yaw = Math.atan2(toward[0]-at[0], toward[1]-at[1]); pitch = -0.1; jump.value=''; };
addEventListener('keydown',e=>keys[e.code]=1); addEventListener('keyup',e=>keys[e.code]=0);
let drag=null; const lookEl=document.getElementById('look'); const isTouch = matchMedia('(pointer:coarse)').matches; if(!isTouch) document.body.classList.add('desk');
(isTouch?lookEl:ren.domElement).addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];}); ren.domElement.addEventListener('dblclick',()=>ren.domElement.requestPointerLock?.());
addEventListener('pointermove',e=>{ if(document.pointerLockElement){ yaw+=e.movementX*0.0025; pitch=Math.max(-1.2,Math.min(1.2,pitch-e.movementY*0.0025)); } else if(drag){ yaw+=(e.clientX-drag[0])*0.004; pitch=Math.max(-1.2,Math.min(1.2,pitch-(e.clientY-drag[1])*0.004)); drag=[e.clientX,e.clientY]; } });
addEventListener('pointerup',()=>drag=null);
let padv=[0,0]; const pad=document.getElementById('pad'), knob=document.getElementById('knob'); let padId=null;
pad.addEventListener('pointerdown',e=>{padId=e.pointerId}); addEventListener('pointermove',e=>{ if(e.pointerId!==padId) return; const r=pad.getBoundingClientRect(); let dx=(e.clientX-(r.left+60))/60, dy=(e.clientY-(r.top+60))/60; const m=Math.hypot(dx,dy); if(m>1){dx/=m;dy/=m;} padv=[dx,-dy]; knob.style.left=(40+dx*40)+'px'; knob.style.top=(40-(-dy)*40*-1)+'px'; });
addEventListener('pointerup',e=>{ if(e.pointerId===padId){padId=null;padv=[0,0];knob.style.left='40px';knob.style.top='40px';} });
function nearestRun(x,y){ let best=null,bd=1e9; for(const p of P) for(const [qx,qy] of p.points){ const d=(qx-x)**2+(qy-y)**2; if(d<bd){bd=d;best=p;} } return bd<40*40?best:null; }
let last=performance.now(); let lean=0, speedNow=0, edgeHit=0;
function frame(now){ const dt=Math.min(0.05,(now-last)/1000); last=now;
  if (RIDE){ const u = Math.min(1, (now-RIDE.t0)/RIDE.dur); const seq = RIDE.s.seq; let target = u*RIDE.s.len, acc=0, i=1; while (i<seq.length-1 && acc+Math.hypot(seq[i][0]-seq[i-1][0], seq[i][1]-seq[i-1][1]) < target){ acc += Math.hypot(seq[i][0]-seq[i-1][0], seq[i][1]-seq[i-1][1]); i++; }
    const segL = Math.hypot(seq[i][0]-seq[i-1][0], seq[i][1]-seq[i-1][1]) || 1; const f = Math.min(1, (target-acc)/segL); const x = seq[i-1][0]+(seq[i][0]-seq[i-1][0])*f, y = seq[i-1][1]+(seq[i][1]-seq[i-1][1])*f;
    px = x; py = y; const cableZ = hAt(x,y) + 12 - 3.5;  // chair hangs ~3.5 m under the cable
    yaw = Math.atan2(seq[seq.length-1][0]-x, seq[seq.length-1][1]-y); if (u >= 1){ px = RIDE.s.top[0]; py = RIDE.s.top[1]; yaw = Math.atan2(RIDE.s.bot[0]-px, RIDE.s.bot[1]-py); RIDE = null; }
    else { cam.position.set(px, cableZ, D-py); sky.position.copy(cam.position); cam.rotation.set(0,0,0); cam.rotateY(-yaw); cam.rotateX(pitch*0.5 - 0.05); if (window.updateTrees && (now|0)%4===0) window.updateTrees(cam.position); if ((now|0)%100<17) drawMini(); chevTex.offset.y = 1-(now/1000*0.08)%1; ren.render(scene,cam); requestAnimationFrame(frame); return; } }
  let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)+padv[1], s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+padv[0];
  const fx=Math.sin(yaw), fy=Math.cos(yaw);           // forward in (east, north)
  const sp = SPEED*((keys.ShiftLeft||keys.ShiftRight)?3:1); let nxp=px+(fx*f+fy*s)*sp*dt, nyp=py+(fy*f-fx*s)*sp*dt; nxp=Math.max(1,Math.min(W-1,nxp)); nyp=Math.max(1,Math.min(D-1,nyp));
  // slope rule: walking speed falls on steep ground; this is where "slide when steep" goes later
  const h0=hAt(px,py), h1=hAt(nxp,nyp); const grade=(h1-h0)/Math.max(0.01,Math.hypot(nxp-px,nyp-py));
  if (grade>0.7){ /* too steep to climb */ }
  else if (!BOUND || walkable(nxp,nyp)){ px=nxp; py=nyp; }
  else if (walkable(nxp,py)){ px=nxp; }            // slide along the corridor edge
  else if (walkable(px,nyp)){ py=nyp; }
  else { edgeHit = now; }
  const h=hAt(px,py)+(nearestRun(px,py)?0.6:0); cam.position.set(px, h+EYE, D-py); sky.position.copy(cam.position);
  // slope ahead along the view bearing (metres rise per metre), as an angle; lean fraction 0.5 → 0.75 with speed
  const ahead = hAt(Math.max(1,Math.min(W-1,px+fx*12)), Math.max(1,Math.min(D-1,py+fy*12))) - hAt(px,py); const slopeAng = Math.atan2(ahead, 12);
  const moving = Math.hypot(f, s) > 0.05; speedNow += ((moving ? sp : 0) - speedNow) * Math.min(1, dt*3);
  const frac = 0.5 + 0.25 * Math.min(1, speedNow / (SPEED*3)); const target = slopeAng * frac;
  lean += (target - lean) * Math.min(1, dt*4);
  cam.rotation.set(0,0,0); cam.rotateY(-yaw); cam.rotateX(pitch + lean);
  const st = nearStation(); if (st && !RIDE){ prompt.textContent = `ride ${st.l.name||st.l.type} ▲ ${Math.round(st.top[2])} m — E / tap`; prompt.style.display='block'; } else prompt.style.display='none';
  const r=nearestRun(px,py); document.getElementById('pos').textContent=`${Math.round(h)} m · ${Math.round(px)} E ${Math.round(py)} N`; document.getElementById('run').textContent=(r?`on: ${r.name||'unnamed'} (${r.difficulty||'?'})${r.resort&&new Set(P.map(x=>x.resort)).size>1?' · '+r.resort:''}`:'')+` · ${PISTE_MESHES.length} runs`+((now-edgeHit)<400?' · trail edge':'');
  if (window.updateTrees && (now|0) % 4 === 0) window.updateTrees(cam.position); if (terrMat.userData.sh) terrMat.userData.sh.uniforms.uTime.value = now/1000;
  if ((now|0) % 100 < 17) drawMini();
  chevTex.offset.y = 1 - (now/1000*0.08) % 1;   // decreasing offset → features drift toward larger v = downhill
  ren.render(scene,cam); requestAnimationFrame(frame); }
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
requestAnimationFrame(frame);
</script></body></html>
